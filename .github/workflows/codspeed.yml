# This workflow runs the performance benchmarks and reports the results to CodSpeed
# For more information see: https://codspeed.io/docs/integrations/ci/github-actions

name: CodSpeed

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  # allows CodSpeed to trigger backtest performance analysis
  workflow_dispatch:

permissions:
  contents: read
  id-token: write  # for OpenID Connect authentication with CodSpeed

jobs:
  benchmarks:
    name: Run benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0  # setup-uv does not publish a floating v9 tag
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: uv sync --group test
      - name: Run benchmarks
        uses: CodSpeedHQ/action@v5
        with:
          mode: simulation
          run: uv run --no-sync pytest benchmarks --codspeed -p no:randomly
